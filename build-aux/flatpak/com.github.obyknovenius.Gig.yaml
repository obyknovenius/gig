id: com.github.obyknovenius.Gig
branch: master
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: gig
finish-args:
  - --device=dri
  - --filesystem=xdg-download
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland
cleanup:
  - /include
  - /lib/pkgconfig
modules:
  - name: gig
    buildsystem: meson
    sources:
      - type: dir
        path: ../..
