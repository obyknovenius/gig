name: Flatpak
on:
  push:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  MANIFEST: build-aux/flatpak/com.github.obyknovenius.Gig.yaml
  BUNDLE: gig.flatpak
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          test -n "$key" || { echo "No secret key imported" >&2; exit 1; }
          echo "GPG_KEY_ID=$key" >> "$GITHUB_ENV"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ env.MANIFEST }}
          bundle: ${{ env.BUNDLE }}
          artifact-name: ${{ env.BUNDLE }}
          repo-dir: repo
          gpg-sign: ${{ env.GPG_KEY_ID }}
      - name: Prepare Flatpak repository
        run: |
          flatpak build-update-repo --generate-static-deltas --prune \
            --gpg-sign="$GPG_KEY_ID" \
            --title=Gig --default-branch=master repo
          mkdir site
          mv repo site/repo
          cp build-aux/flatpak/gig.flatpakrepo site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUNDLE }}
      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$BUNDLE" --prerelease
  pages:
    name: Deploy repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
